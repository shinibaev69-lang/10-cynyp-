<html lang="kk">
<head>

    <title>10-сынып Информатика - ЖИ және Машиналық Оқыту Тесті</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 850px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* Нұсқа таңдау түймелері */
        .variant-select {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-var {
            background-color: #4c51bf;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-var:hover {
            background-color: #434190;
            transform: translateY(-2px);
        }

        .btn-var.active {
            background-color: #38a169;
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.4);
        }

        .question-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #f7fafc;
        }

        /* Оқу мақсатының стилі */
        .learning-objective {
            font-size: 13px;
            color: #2b6cb0;
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 6px 12px;
            border-radius: 0 6px 6px 0;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2d3748;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            background-color: #fff;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            border-color: #4c51bf;
            background-color: #f7fafc;
        }

        .option-label.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option-label input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* АНИМАЦИЯЛАР */
        @keyframes correctPulse {
            0% { transform: scale(1); background-color: #c6f6d5; }
            50% { transform: scale(1.02); background-color: #9ae6b4; }
            100% { transform: scale(1); background-color: #c6f6d5; }
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .correct-anim {
            animation: correctPulse 0.5s ease-in-out forwards;
            border-color: #38a169 !important;
            color: #22543d;
            font-weight: bold;
        }

        .wrong-anim {
            animation: shakeError 0.4s ease-in-out forwards;
            border-color: #e53e3e !important;
            background-color: #fed7d7 !important;
            color: #742a2a;
        }

        .feedback-box {
            margin-top: 12px;
            font-weight: bold;
            font-size: 15px;
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            animation: popIn 0.3s ease-out;
        }

        .btn-submit {
            background-color: #38a169;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2f855a;
        }

        /* Соңғы нәтиже блогы */
        #result-box {
            display: none;
            text-align: center;
            padding: 25px;
            background-color: #f0fff4;
            border: 2px solid #38a169;
            border-radius: 12px;
            margin-top: 25px;
            animation: popIn 0.5s ease-out;
        }

        .score-emoji {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>

                question: "4. Машиналық оқытудың дәстүрлі бағдарламалаудан айырмашылығы қандай?",
                options: ["Ережелер қолдан жазылмайды, оны модель деректерден өзі үйренеді", "Код мүлдем жазылмайды", "Тек математикалық қосуды орындайды", "Интернетсіз жұмыс істемейді"],
                correct: 0
            },
            {
                objective: "10.1.2.3 перцептрон құрылымын (кірістер, салмақ, белсендіру функциясы, шығыс) сипаттау",
                question: "5. Перцептрондағы 'Bias' (ығысу/смещение) параметрі не үшін қажет?",
                options: ["Белсендіру функциясының шегін (порог) жылжыту үшін", "Нәтижені жою үшін", "Кіріс мәнін өшіру үшін", "Жадты тазалау үшін"],
                correct: 0
            },
            {
                objective: "10.1.2.3 перцептрон құрылымын (кірістер, салмақ, белсендіру функциясы, шығыс) сипаттау",
                question: "6. Қарапайым бір қабатты перцептрон қандай есептерді шеше АЛМАЙДЫ?",
                options: ["Сызықтық бөлінетін есептерді", "Сызықтық бөлінбейтін (XOR) есептерді", "Салыстыру есептерін", "Қосу есептерін"],
                correct: 1
            },
            {
                objective: "10.1.2.4 электронды кестелерде бірлік секіріс (Хевисайд) функциясын қолданып, перцептрон жұмысын модельдеу және салмақтың өзгеруі оқыту үдерісіне қалай әсер ететінін түсіндіру",
                question: "7. Перцептронның оқыту жылдамдығы (Learning rate) тым жоғары болса не болады?",
                options: ["Салмақтар тым қатты өзгеріп, оптималды шешімді өткізіп алуы мүмкін", "Модель лезде мінсіз болады", "Нәтиже 0 болады", "Формула өшеді"],
                correct: 0
            },
            {
                objective: "10.1.2.4 электронды кестелерде бірлік секіріс (Хевисайд) функциясын қолданып, перцептрон жұмысын модельдеу және салмақтың өзгеруі оқыту үдерісіне қалай әсер ететінін түсіндіру",
                question: "8. Перцептрон салмағын жаңартудағы Δw (салмақ өзгерісі) неге байланысты?",
                options: ["Қателікке (Error = Күтілген мән - Алынған мән) және оқыту жылдамдығына", "Монитор диагоналына", "Файл атына", "Тінтуір түріне"],
                correct: 0
            },
            {
                objective: "10.1.2.5 машиналық оқыту түрлерін (мұғаліммен, мұғалімсіз, негіздеп) жіктеу",
                question: "9. Клиенттерді мінез-құлқы бойынша алдын ала белгіленбеген топтарға бөлу қай оқыту түріне жатады?",
                options: ["Мұғалімсіз оқыту (Unsupervised learning)", "Мұғаліммен оқыту", "Негіздеп оқыту", "Қолдан оқыту"],
                correct: 0
            },
            {
                objective: "10.1.2.6 электрондық кестелерде практикалық тапсырмалардың шешімін табу үшін k-means және сызықтық регрессия оқыту алгоритмдерін модельдеу",
                question: "10. K-means алгоритміндегі 'K' әрпі нені білдіреді?",
                options: ["Кластерлердің (топтардың) санын", "Коэффициентті", "Арақашықтықты", "Нүктелер санын"],
                correct: 0
            }
        ]
    };

    let currentVariant = 1;
    let userAnswers = {};

    window.onload = function() {
        renderQuiz();
    };

    // Нұсқа таңдау
    function selectVariant(variant) {
        currentVariant = variant;
        const buttons = document.querySelectorAll('.btn-var');
        buttons.forEach((btn, idx) => {
            if (idx + 1 === variant) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        resetQuiz();
    }

    // Тестті экранға шығару
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        const questions = quizData[currentVariant];

        questions.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';

            let optionsHTML = '';
            q.options.forEach((opt, oIndex) => {
                optionsHTML += `
                    <label class="option-label" id="label-${qIndex}-${oIndex}">
                        <input type="radio" name="question-${qIndex}" value="${oIndex}" onchange="registerAnswer(${qIndex}, ${oIndex})">
                        ${opt}
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="learning-objective">Оқу мақсаты: ${q.objective}</div>
                <div class="question-text">${q.question}</div>
                <div class="options">${optionsHTML}</div>
                <div class="feedback-box" id="feedback-${qIndex}"></div>
            `;

            container.appendChild(card);
        });
    }

    // ТЕК БІР РЕТ ЖАУАП БЕРУ ЖӘНЕ АНИМАЦИЯ ШЫҒАРУ
    function registerAnswer(qIndex, selectedOption) {
        // Егер осы сұраққа бұрын жауап берілсе, тоқтату
        if (userAnswers[qIndex] !== undefined) {
            return;
        }

        userAnswers[qIndex] = selectedOption;
        const correctOption = quizData[currentVariant][qIndex].correct;
        const feedbackDiv = document.getElementById(`feedback-${qIndex}`);

        // Барлық радио түймелерді бұғаттау (екінші рет таңдай алмайды)
        const inputs = document.querySelectorAll(`input[name="question-${qIndex}"]`);
        inputs.forEach(input => {
            input.disabled = true;
            input.parentElement.classList.add('disabled');
        });

        const selectedLabel = document.getElementById(`label-${qIndex}-${selectedOption}`);
        feedbackDiv.style.display = 'flex';

        if (selectedOption === correctOption) {
            // Дұрыс жауап анимациясы
            selectedLabel.classList.add('correct-anim');
            feedbackDiv.innerHTML = `<span>😊 Өте жақсы! Жауабыңыз дұрыс!</span>`;
            feedbackDiv.style.color = '#27ae60';
            feedbackDiv.style.backgroundColor = '#e8f8f5';
        } else {
            // Қате жауап анимациясы (Shake)
            selectedLabel.classList.add('wrong-anim');
            
            // Дұрыс жауапты да бірге көрсетіп қою
            const correctLabel = document.getElementById(`label-${qIndex}-${correctOption}`);
            correctLabel.style.borderColor = '#38a169';
            correctLabel.style.backgroundColor = '#c6f6d5';

            feedbackDiv.innerHTML = `<span>😔 Қате! Дұрыс жауап жасыл түспен белгіленді.</span>`;
            feedbackDiv.style.color = '#c0392b';
            feedbackDiv.style.backgroundColor = '#fadbd8';
        }
    }

    // Соңғы нәтижені бағалау
    function checkAnswers() {
        const questions = quizData[currentVariant];
        let score = 0;

        questions.forEach((q, qIndex) => {
            const selected = userAnswers[qIndex];
            if (selected === q.correct) {
                score++;
            }
        });

        const resultBox = document.getElementById('result-box');
        const scoreText = document.getElementById('final-score');
        const emojiDiv = document.getElementById('final-emoji');

        resultBox.style.display = 'block';
        scoreText.innerText = `Сіз 10 сұрақтың ${score} сұрағына дұрыс жауап бердіңіз!`;

        if (score >= 9) {
            emojiDiv.innerText = "🏆 ✨ 🌟";
            scoreText.innerHTML += "<br><strong>Үздік нәтиже! Тақырыпты өте жақсы меңгергенсіз!</strong>";
        } else if (score >= 7) {
            emojiDiv.innerText = "👍 😊 🎉";
            scoreText.innerHTML += "<br><strong>Жақсы нәтиже! Біліміңді ары қарай шыңда!</strong>";
        } else if (score >= 5) {
            emojiDiv.innerText = "😐 📚";
            scoreText.innerHTML += "<br><strong>Орташа нәтиже. Тақырыпты қайталап өту ұсынылады.</strong>";
        } else {
            emojiDiv.innerText = "😢 📖 💡";
            scoreText.innerHTML += "<br><strong>Төмен нәтиже. Материалдарды қайта оқып шығыңыз!</strong>";
        }

        resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    // Тестті қайта жүктеу
    function resetQuiz() {
        userAnswers = {};
        document.getElementById('result-box').style.display = 'none';
        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
